{{ partial "header.html" . }}

{{ $entries := len (findRE "<h2" .Content) }}

<section class="kids-page" aria-labelledby="kids-page-title">
  <header class="kids-page-header">
    <div class="kids-page-heading">
      <p class="eyebrow">CHILDHOOD NOTES / {{ $entries }} 则</p>
      <h1 id="kids-page-title">{{ .Title }}</h1>
      <p class="kids-page-lede">把成长里那些容易被时间带走的小事，慢慢记下来。</p>
    </div>
    <aside class="kids-page-aside">
      <span>独立更新</span>
      <p>从一岁到五岁，<br>也从父母的视角重新认识童年。</p>
    </aside>
  </header>

  {{ with .TableOfContents }}
    <section class="kids-index" aria-labelledby="kids-index-title">
      <p class="eyebrow" id="kids-index-title">CHAPTERS</p>
      {{ . }}
    </section>
  {{ end }}

  <div class="kids-content">
    {{ .Content }}
  </div>

  {{ .Render "path" }}
</section>

{{ partial "footer-cus.html" . }}
