{{- if .Site.Params.twikoo.enable -}}
{{- $envID := .Site.Params.twikoo.envId | default "https://pl.elizen.me/" -}}
<section class="comment-section" aria-labelledby="comment-section-title">
  <header class="comment-section-header">
    <p class="eyebrow">DISCUSSION / 留言</p>
    <div>
      <h2 id="comment-section-title">留下几句话</h2>
      <p>名字可以随意，邮箱只用来识别头像，不会公开。</p>
    </div>
  </header>

  <div class="comment-system" data-comment-system>
    <div id="tcomment"></div>
    <p class="comment-system-status" data-comment-status hidden>评论服务暂时没有连上，请稍后再试。</p>
  </div>
</section>

<script src="https://fastly.jsdelivr.net/npm/twikoo@1.7.15/dist/twikoo.min.js"></script>
<script>
  (function () {
    var envId = {{ printf "%q" $envID | safeJS }};
    var system = document.querySelector('[data-comment-system]');
    var status = document.querySelector('[data-comment-status]');

    function showUnavailable() {
      if (status) status.hidden = false;
    }

    if (!window.twikoo) {
      showUnavailable();
      return;
    }

    twikoo.init({
      envId: envId,
      el: '#tcomment',
      path: window.location.pathname,
      lang: 'zh-CN'
    }).catch(showUnavailable);

    if (system && window.MutationObserver) {
      new MutationObserver(function () {
        var error = system.querySelector('.tk-error-message');
        if (error && /评论失败/.test(error.textContent || '')) {
          error.textContent = '评论服务暂时没有连上，请稍后再试。';
          showUnavailable();
        }
      }).observe(system, { childList: true, subtree: true, characterData: true });
    }

    if (window.fetch && window.AbortController) {
      var controller = new AbortController();
      var timer = window.setTimeout(function () { controller.abort(); }, 8000);
      fetch(envId, { method: 'GET', mode: 'cors', cache: 'no-store', signal: controller.signal })
        .then(function (response) {
          window.clearTimeout(timer);
          if (!response.ok) showUnavailable();
        })
        .catch(function () {
          window.clearTimeout(timer);
          showUnavailable();
        });
    }
  })();
</script>
{{- end }}
