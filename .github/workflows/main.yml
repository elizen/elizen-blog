name: Deploy Hugo

on:
  push:
    branches:
      - master
  workflow_run:
    workflows: [douban]
    types: [completed]
    branches:
      - master

permissions:
  contents: read

# ei-radar 每小时推数据会连环触发构建：让最新的排队构建顶掉旧的，省时间省额度
concurrency:
  group: hugo-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    # workflow_run is a privileged trigger. Only trust a successful douban
    # run from this repository's default branch; the checkout below
    # deliberately uses that fixed branch rather than an event-supplied
    # branch or artifact.
    if: >-
      github.event_name == 'push' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # v2 does not have submodules option now
        with:
          ref: ${{ github.event.repository.default_branch }}
       # with:
       #   submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 0.119.0
          # extended: true

      - name: Test Douban cover handling
        run: python3 -m unittest discover -s .github/tests -v

      - name: Build
        run: |
          python3 .github/cache-douban-posters.py
          hugo

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.personal_token }} # 这里的 ACTIONS_DEPLOY_KEY 则是上面设置 Private Key的变量名
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: ./public
          commit_message: "${{ github.event_name == 'workflow_run' && 'chore: deploy after douban sync' || github.event.head_commit.message }}"
